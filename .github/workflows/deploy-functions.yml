name: Deploy Function App

on:
  push:
    branches: [main]
    paths:
      - "function-app/**"
      - "scripts/download_fonts.py"
      - ".github/workflows/deploy-functions.yml"
  workflow_dispatch:

permissions:
  id-token: write   # OIDC token for azure/login
  contents: read

concurrency:
  group: deploy-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # fonts/ is gitignored; bundle them into the package
      - name: Download fonts
        run: python3 scripts/download_fonts.py

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Dependencies are installed by Oryx on the app side (remote build),
      # same as `func azure functionapp publish --python`.
      - name: Deploy
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
          package: function-app
          scm-do-build-during-deployment: true
          enable-oryx-build: true
